name: ib_insync

on: [ push, pull_request ]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: [ "3.13", "3.14", "3.15" ]

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install package and dev dependencies
        run: pip install -e ".[dev]"

      - name: Flake8 static code analysis
        run: flake8 ib_insync

      - name: MyPy static code analysis
        run: mypy -p ib_insync

      - name: Run unit tests
        run: pytest -W error

      - name: Verify package build
        run: |
          python -m build
          python -c "import zipfile, glob; z = zipfile.ZipFile(glob.glob('dist/*.whl')[0]); assert 'ib_insync/py.typed' in z.namelist(), z.namelist()"
