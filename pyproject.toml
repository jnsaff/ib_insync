[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "ib_insync"
dynamic = ["version"]
description = "Python sync/async framework for Interactive Brokers API"
readme = "README.rst"
license = "BSD-2-Clause"
license-files = ["LICENSE"]
requires-python = ">=3.13"
authors = [
    { name = "Ewald R. de Wit", email = "ewald.de.wit@gmail.com" },
]
keywords = ["ibapi", "tws", "asyncio", "jupyter", "interactive brokers", "async"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Topic :: Office/Business :: Financial :: Investment",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Programming Language :: Python :: 3.15",
]
dependencies = [
    "aeventkit",
    "anest-asyncio",
    "tzdata",
]

[project.urls]
Homepage = "https://github.com/jnsaff/ib_insync"
Documentation = "https://ib-insync.readthedocs.io/api.html"

[project.optional-dependencies]
dev = [
    "build",
    "flake8",
    "mypy",
    "pytest",
    "pytest-asyncio",
]
docs = [
    "sphinx",
    "sphinx-autodoc-typehints",
    "sphinx-rtd-theme",
]
pandas = [
    "pandas",
]

[tool.setuptools]
packages = ["ib_insync"]

[tool.setuptools.package-data]
ib_insync = ["py.typed"]

[tool.setuptools.dynamic]
version = { attr = "ib_insync.version.__version__" }

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "integration: tests requiring a live TWS/IBG connection",
]
addopts = '-m "not integration"'
asyncio_default_fixture_loop_scope = "function"
asyncio_default_test_loop_scope = "function"

[tool.mypy]
python_version = "3.13"
mypy_path = "stubs"
strict = true
warn_unused_configs = true

[[tool.mypy.overrides]]
module = ["pandas.*", "matplotlib.*"]
ignore_missing_imports = true
